name: dbt PR CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python environment
        run: uv sync

      - name: Add venv to PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # --- Code quality checks first (fast feedback, no dbt connection needed) ---

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run sqlfluff lint
        run: |
          cd monorepo_dbt_demo
          uv run sqlfluff lint models/ --dialect snowflake --config ../.sqlfluff

      # --- dbt checks (requires warehouse connection) ---

      - name: Install dbt packages
        run: |
          cd monorepo_dbt_demo
          dbt deps

      - name: Download latest prod dbt artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true           # First-ever run has no artifact yet
        with:
          name: dbt-prod-artifacts
          path: monorepo_dbt_demo/prod-state

      - name: Run dbt parse (validate project compiles)
        run: |
          cd monorepo_dbt_demo
          dbt parse

      - name: Run dbt build with deferred state
        if: hashFiles('monorepo_dbt_demo/prod-state/manifest.json') != ''
        run: |
          cd monorepo_dbt_demo
          dbt build --select state:modified+ --defer --state prod-state
        env:
          DBT_TARGET: ci                  # Use a separate CI target/schema in profiles.yml

      - name: Run full dbt build (no prior artifacts)
        if: hashFiles('monorepo_dbt_demo/prod-state/manifest.json') == ''
        run: |
          cd monorepo_dbt_demo
          dbt build
        env:
          DBT_TARGET: ci